sources:
  - name: jaffle_shop
    description: A clone of a Postgres database
    database: dbt-tutorial
    schema: jaffle_shop
    tables:
      - name: customers
        description: Raw customers data
        columns:
          - name: id
            description: primary key
            data_tests:
              - unique
              - not_null        
      - name: orders
        columns:
          - name: id
            description: primary key
            data_tests:
              - unique
              - not_null 
        config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 1
              period: day
          loaded_at_field: _etl_loaded_at
  # Tables from the newer dbt-labs/jaffle-shop dataset, which dbt-tutorial
  # doesn't publish. Loaded once with `bq load` from the repo's
  # seeds/jaffle-data/raw_*.csv into our own project (location US).
  # Their ids are UUIDs, so they don't join to the integer ids in
  # jaffle_shop.orders above. `orders` was added here (rather than reusing
  # jaffle_shop.orders) specifically because it carries store_id, letting
  # order_items join through to stores/locations — something the classic
  # tutorial source can't do.
  - name: jaffle_shop_raw
    description: Raw Jaffle Shop orders, items, products, stores and supplies, loaded from the dbt-labs/jaffle-shop CSVs
    database: "{{ target.project }}"
    schema: jaffle_shop_raw
    tables:
      - name: orders
        description: Raw orders, one row per order. Has no status field (unlike jaffle_shop.orders) but does carry store_id. Amounts are stored in cents.
        columns:
          - name: id
            description: primary key
            data_tests:
              - unique
              - not_null
      - name: order_items
        description: Raw order line items, one row per item sold
        columns:
          - name: id
            description: primary key
            data_tests:
              - unique
              - not_null
      - name: products
        description: Raw product catalog. Prices are stored in cents.
        columns:
          - name: sku
            description: primary key
            data_tests:
              - unique
              - not_null
      - name: stores
        description: Raw store locations
        columns:
          - name: id
            description: primary key
            data_tests:
              - unique
              - not_null
      - name: supplies
        description: Raw supplies used per product. Costs are stored in cents. A supply id repeats once per product (sku) that uses it.
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - id
                  - sku
