name: 'dbt_fundamentals_on_demand'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
# See profiles.yml.example for the BigQuery connection this profile expects.
profile: 'default'

require-dbt-version: [">=1.8.0", "<2.0.0"]

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

flags:
  send_anonymous_usage_stats: false

# Staging models are lightweight, 1:1 views over sources.
# Marts are the query-ready, tested tables analysts and BI tools consume.
models:
  dbt_fundamentals_on_demand:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
      finance:
        +group: finance
      marketing:
        +group: marketing

# Seeds are CSV files in the `seeds/` directory, loaded into the warehouse
# with `dbt seed`. Setting +column_types makes the loaded schema explicit
# instead of letting dbt infer it from the CSV contents.
seeds:
  dbt_fundamentals_on_demand:
    +schema: seeds
    order_status_descriptions:
      +column_types:
        status: string
        status_description: string
        is_completed: boolean

# Snapshots get their own schema so they're clearly separated from
# regular models in the warehouse.
snapshots:
  dbt_fundamentals_on_demand:
    +target_schema: snapshots
